<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" href="style.css">
    <script src="atv.js"></script>
</head>
<body>
    <header class="header">
        <h1>📚 Gestão de Biblioteca</h1>
        <p>Painel de controlo de acervo, leitores e empréstimos</p>
    </header>

    <!-- Painel de Indicadores -->
    <div class="stats-bar">
        <div class="stat-card">
            <span class="stat-number" id="total-livros">0</span>
            <span class="stat-label">Total de Livros</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="total-usuarios">0</span>
            <span class="stat-label">Usuários Ativos</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="total-emprestimos-ativos">0</span>
            <span class="stat-label">Empréstimos Pendentes</span>
        </div>
    </div>

    <!-- Menu de Navegação -->
    <nav class="nav-buttons">
        <button id="btn-tab-livros" class="nav-btn active" onclick="showSection('livros')">📖 Livros</button>
        <button id="btn-tab-usuarios" class="nav-btn" onclick="showSection('usuarios')">👥 Usuários</button>
        <button id="btn-tab-emprestimos" class="nav-btn" onclick="showSection('emprestimos')">📋 Empréstimos</button>
    </nav>

    <main class="container">
        <!-- SEÇÃO: CADASTRO DE LIVROS -->
        <section id="sec-livros" class="content-section">
            <h2>📚 Cadastro de Livros</h2>
            <form id="form-livro" class="form">
                <div class="form-group">
                    <label for="livro-titulo">Título do Livro</label>
                    <input type="text" id="livro-titulo" placeholder="Ex.: Dom Casmurro" required>
                </div>
                <div class="form-group">
                    <label for="livro-autor">Autor</label>
                    <input type="text" id="livro-autor" placeholder="Ex.: Machado de Assis" required>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="livro-genero">Gênero</label>
                        <input type="text" id="livro-genero" placeholder="Ex.: Literatura Brasileira" required>
                    </div>
                    <div class="form-group flex-1">
                        <label for="livro-ano">Ano</label>
                        <input type="number" id="livro-ano" placeholder="Ex.: 1899" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-main">Cadastrar Livro</button>
            </form>

            <div class="section-header">
                <h3>Livros Cadastrados</h3>
                <input type="text" id="search-livros" class="search-input" placeholder="🔍 Procurar título ou autor..." oninput="renderLivros()">
            </div>
            <div id="lista-livros" class="cards-list"></div>
        </section>

        <!-- SEÇÃO: CADASTRO DE USUÁRIOS -->
        <section id="sec-usuarios" class="content-section hidden">
            <h2>👥 Cadastro de Usuários</h2>
            <form id="form-usuario" class="form">
                <div class="form-group">
                    <label for="usuario-nome">Nome Completo</label>
                    <input type="text" id="usuario-nome" placeholder="Ex.: Maria Souza" required>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="usuario-email">E-mail</label>
                        <input type="email" id="usuario-email" placeholder="maria@email.com" required>
                    </div>
                    <div class="form-group flex-1">
                        <label for="usuario-telefone">Telefone</label>
                        <input type="text" id="usuario-telefone" placeholder="(00) 90000-0000" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-main">Cadastrar Usuário</button>
            </form>

            <div class="section-header">
                <h3>Usuários Cadastrados</h3>
                <input type="text" id="search-usuarios" class="search-input" placeholder="🔍 Procurar usuário..." oninput="renderUsuarios()">
            </div>
            <div id="lista-usuarios" class="cards-list"></div>
        </section>

        <!-- SEÇÃO: REGISTRO E HISTÓRICO DE EMPRÉSTIMOS -->
        <section id="sec-emprestimos" class="content-section hidden">
            <h2>📋 Registro de Empréstimos</h2>
            <form id="form-emprestimo" class="form">
                <div class="form-group">
                    <label for="select-usuario">Selecionar Usuário</label>
                    <select id="select-usuario" required>
                        <option value="">Escolha um usuário...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="select-livro">Selecionar Livro (Disponíveis)</label>
                    <select id="select-livro" required>
                        <option value="">Escolha um livro...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="data-emprestimo">Data do Empréstimo</label>
                    <input type="date" id="data-emprestimo" required>
                </div>
                <button type="submit" class="btn btn-main">Registrar Empréstimo</button>
            </form>

            <div class="section-header">
                <h3>Histórico de Empréstimos</h3>
            </div>
            <div id="lista-emprestimos" class="cards-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
